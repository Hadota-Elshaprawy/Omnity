name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project
        run: |
          mkdir project
          unzip -q OmniaWorldAndroid_Chat_GitHub_Project.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Build APK
        run: |
          cd project/OmniaWorldAndroid_Chat
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniaWorld-debug-apk
          path: project/OmniaWorldAndroid_Chat/app/build/outputs/apk/debug/app-debug.apk
